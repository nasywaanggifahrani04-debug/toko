<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GadgetStore Management System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
        }

        /* 1. Header Utama */
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 2.2rem;
            letter-spacing: 1px;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Style Kartu Pembatas Section */
        .card-section {
            background: #ffffff;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
            border: 1px solid #e0e0e0;
        }

        .card-section h2 {
            margin-bottom: 20px;
            color: #1e3c72;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
        }

        /* 2. Fitur Panel Admin */
        .admin-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input, 
        .form-group textarea {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
        }

        .form-group textarea {
            resize: vertical;
            height: 80px;
        }

        .btn-submit {
            background-color: #28a745;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background-color: #218838;
        }

        /* 3. Fitur Panel Pembeli */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .product-card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 12px;
        }

        .product-title {
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .product-price {
            font-weight: bold;
            color: #d9534f;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .product-description {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 15px;
            flex-grow: 1;
        }

        .product-card video {
            width: 100%;
            border-radius: 6px;
            margin-bottom: 15px;
            background-color: #000;
        }

        .btn-buy {
            display: block;
            text-align: center;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn-buy:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <header>
        <h1>GadgetStore Management System</h1>
    </header>

    <div class="container">
        
        <section class="card-section">
            <h2>Panel Administrator (Manajemen Produk & Media)</h2>
            <form class="admin-form">
                <div class="form-group">
                    <label for="nama">Nama Produk:</label>
                    <input type="text" id="nama" placeholder="Contoh: Smartphone Premium" required>
                </div>

                <div class="form-group">
                    <label for="harga">Harga Produk:</label>
                    <input type="text" id="harga" placeholder="Contoh: Rp 12.000.000" required>
                </div>

                <div class="form-group">
                    <label for="deskripsi">Deskripsi Produk:</label>
                    <textarea id="deskripsi" placeholder="Tuliskan spesifikasi utama..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="url-gambar">URL Gambar Produk (image source):</label>
                    <input type="url" id="url-gambar" placeholder="https://example.com/gambar.jpg" required>
                </div>

                <div class="form-group">
                    <label for="url-video">URL Video Demo Produk (video source):</label>
                    <input type="url" id="url-video" placeholder="https://example.com/video.mp4" required>
                </div>

                <button type="button" class="btn-submit" onclick="alert('Simpan Produk ke Database Berhasil!')">
                    Simpan Produk ke Database
                </button>
            </form>
        </section>

        <section class="card-section">
            <h2>Panel Pembeli (Katalog & Transaksi)</h2>
            <div class="product-grid">

                <div class="product-card">
                    <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500" alt="Smartphone Premium">
                    <h3 class="product-title">Smartphone Premium</h3>
                    <div class="product-price">Rp 12.000.000</div>
                    <p class="product-description">Layar 120Hz Super AMOLED, RAM 12GB, Chipset Snapdragon Terbaru.</p>
                    
                    <video controls>
                        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                    </video>
                    
                    <a href="#" class="btn-buy" onclick="alert('Pesanan belum dibayar.')">Beli Sekarang</a>
                </div>

            </div>
        </section>

    </div>

</body>
</html>
